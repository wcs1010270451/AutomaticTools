<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AutomaticTools，减少重复操作的实用工具平台。">
  <meta name="theme-color" content="#176b53">
  <title>AutomaticTools 工具平台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      color: oklch(27% 0.018 165);
      background: oklch(97.5% 0.008 145);
      --ink: oklch(27% 0.018 165);
      --muted: oklch(50% 0.018 165);
      --paper: oklch(98.5% 0.006 145);
      --line: oklch(88% 0.018 155);
      --green: oklch(47% 0.105 165);
      --green-dark: oklch(34% 0.078 165);
      --green-soft: oklch(91% 0.052 158);
      --coral: oklch(63% 0.17 35);
      --yellow: oklch(81% 0.15 85);
      --shadow: 0 22px 60px oklch(24% 0.025 165 / 0.16);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .site-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 0 max(24px, calc((100% - 1180px) / 2));
      color: oklch(97% 0.008 150);
      background: var(--green-dark);
      border-bottom: 1px solid oklch(62% 0.07 165 / 0.45);
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 760; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: var(--green-dark);
      background: var(--yellow);
      border-radius: 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .nav-links { display: flex; align-items: center; gap: 28px; font-size: 14px; }
    .nav-links a { color: oklch(90% 0.016 155); }
    .nav-links a:hover { color: oklch(99% 0.004 155); }
    .service-status { display: inline-flex; align-items: center; gap: 8px; color: oklch(86% 0.02 155); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: oklch(72% 0.01 160); }
    .service-status.online .status-dot { background: oklch(79% 0.17 145); }
    .service-status.offline .status-dot { background: oklch(67% 0.18 30); }

    .hero {
      position: relative;
      min-height: 74vh;
      overflow: hidden;
      color: oklch(97.5% 0.008 150);
      background: var(--green-dark);
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 92px 0 116px;
    }

    .hero-copy { position: relative; z-index: 3; width: min(640px, 58%); }
    .eyebrow { margin: 0 0 16px; color: var(--yellow); font-size: 15px; font-weight: 700; }
    h1 { margin: 0; font-size: 64px; line-height: 1.03; font-weight: 820; letter-spacing: 0; }
    .hero-lead {
      max-width: 620px;
      margin: 26px 0 0;
      color: oklch(87% 0.022 155);
      font-size: 19px;
      line-height: 1.8;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
    }
    .button-primary { color: var(--green-dark); background: var(--yellow); }
    .button-primary:hover { background: oklch(86% 0.14 85); }
    .button-secondary { color: oklch(97% 0.008 150); border-color: oklch(70% 0.055 165); }
    .button-secondary:hover { background: oklch(42% 0.075 165); }
    .button:focus-visible, .nav-links a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    .product-scene {
      position: absolute;
      right: max(24px, calc((100% - 1180px) / 2));
      bottom: -62px;
      z-index: 1;
      width: 440px;
      height: 510px;
      pointer-events: none;
    }

    .phone {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 278px;
      height: 500px;
      padding: 12px;
      background: oklch(19% 0.012 165);
      border: 1px solid oklch(56% 0.04 165);
      border-radius: 32px;
      box-shadow: var(--shadow);
      transform: rotate(3deg);
    }

    .phone-screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      background: oklch(95% 0.012 145);
      border-radius: 23px;
    }
    .phone-top { height: 86px; padding: 34px 18px 0; color: oklch(97% 0.008 150); background: var(--green); font-weight: 760; }
    .phone-notch { position: absolute; top: 8px; left: 50%; width: 78px; height: 18px; background: oklch(19% 0.012 165); border-radius: 12px; transform: translateX(-50%); }
    .screen-body { padding: 18px; }
    .field-label { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .interval {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }
    .interval span { padding: 9px 2px; text-align: center; background: oklch(90% 0.018 155); border-radius: 5px; font-size: 11px; }
    .interval .active { color: oklch(98% 0.005 150); background: var(--green); }
    .counter { padding: 18px; background: oklch(98% 0.005 150); border: 1px solid var(--line); border-radius: 7px; }
    .counter strong { display: block; margin-top: 5px; font-size: 30px; line-height: 1; }
    .start-control { margin-top: 12px; padding: 14px; color: oklch(98% 0.005 150); text-align: center; background: var(--coral); border-radius: 7px; font-weight: 760; }
    .target {
      position: absolute;
      right: 21px;
      bottom: 102px;
      width: 48px;
      height: 48px;
      border: 3px solid var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 0 7px oklch(63% 0.17 35 / 0.18);
    }
    .target::before, .target::after { content: ""; position: absolute; background: var(--coral); }
    .target::before { top: 20px; left: -10px; width: 62px; height: 2px; }
    .target::after { top: -10px; left: 20px; width: 2px; height: 62px; }

    .floating-panel {
      position: absolute;
      left: 0;
      top: 116px;
      width: 214px;
      padding: 14px;
      color: var(--ink);
      background: oklch(98% 0.006 145);
      border: 1px solid oklch(84% 0.025 155);
      border-radius: 8px;
      box-shadow: var(--shadow);
      transform: rotate(-3deg);
    }
    .panel-grip { height: 8px; margin: -14px -14px 14px; background: var(--yellow); border-radius: 7px 7px 0 0; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
    .panel-row + .panel-row { margin-top: 10px; }
    .panel-value { color: var(--green); font-weight: 760; }
    .panel-action { margin-top: 14px; padding: 10px; color: oklch(98% 0.005 150); text-align: center; background: var(--green); border-radius: 5px; font-size: 12px; font-weight: 760; }

    .tools-section { padding: 72px 24px 88px; background: var(--paper); }
    .section-inner { width: min(1080px, 100%); margin: 0 auto; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .section-head h2 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: 0; }
    .section-head p { max-width: 460px; margin: 0; color: var(--muted); line-height: 1.7; }
    .tool-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 22px;
      padding: 26px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .tool-icon { display: grid; place-items: center; width: 64px; height: 64px; color: oklch(98% 0.005 150); background: var(--coral); border-radius: 8px; font-size: 25px; font-weight: 820; }
    .tool-row h3 { margin: 0 0 7px; font-size: 20px; }
    .tool-row p { margin: 0; color: var(--muted); line-height: 1.6; }
    .platforms { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .platform { padding: 7px 10px; color: var(--green-dark); background: var(--green-soft); border-radius: 5px; font-size: 13px; font-weight: 700; }
    footer { padding: 24px; color: var(--muted); text-align: center; border-top: 1px solid var(--line); font-size: 13px; }

    @media (max-width: 900px) {
      .hero-inner { padding-top: 72px; }
      .hero-copy { width: 68%; }
      h1 { font-size: 52px; }
      .product-scene { right: -94px; opacity: 0.72; }
      .floating-panel { display: none; }
    }

    @media (max-width: 680px) {
      .site-header { min-height: 62px; padding: 0 18px; }
      .nav-links a { display: none; }
      .hero { min-height: 72vh; }
      .hero-inner { width: calc(100% - 36px); padding: 60px 0 260px; }
      .hero-copy { width: 100%; }
      h1 { font-size: 42px; }
      .hero-lead { font-size: 16px; line-height: 1.7; }
      .product-scene { right: -56px; bottom: -245px; width: 330px; transform: scale(.78); transform-origin: right top; opacity: 0.5; }
      .section-head { display: block; }
      .section-head h2 { margin-bottom: 12px; font-size: 28px; }
      .tool-row { grid-template-columns: 54px 1fr; gap: 16px; }
      .tool-icon { width: 54px; height: 54px; }
      .platforms { grid-column: 1 / -1; justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="AutomaticTools 首页">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>AutomaticTools</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="#tools">工具</a>
      <a href="#about">关于</a>
      <span class="service-status" id="service-status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>检查服务</span>
      </span>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">简单、可靠、专注于重复操作</p>
          <h1 id="hero-title">AutomaticTools</h1>
          <p class="hero-lead">把机械的重复操作交给工具。首个自动点击功能支持 Android 与 Windows，更多实用工具正在开发中。</p>
          <div class="hero-actions">
            <a class="button button-primary" href="#tools">查看工具</a>
            <a class="button button-secondary" href="#about">了解平台</a>
          </div>
        </div>
      </div>

      <div class="product-scene" aria-hidden="true">
        <div class="floating-panel">
          <div class="panel-grip"></div>
          <div class="panel-row"><span>点击间隔</span><span class="panel-value">1000 ms</span></div>
          <div class="panel-row"><span>已执行</span><span class="panel-value">1,286 次</span></div>
          <div class="panel-action">正在运行</div>
        </div>
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-notch"></div>
            <div class="phone-top">自动点击</div>
            <div class="screen-body">
              <p class="field-label">点击间隔</p>
              <div class="interval"><span>100ms</span><span class="active">1秒</span><span>2秒</span></div>
              <div class="counter"><span class="field-label">点击统计</span><strong>1,286</strong></div>
              <div class="start-control">停止</div>
            </div>
            <div class="target"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="tools-section" id="tools" aria-labelledby="tools-title">
      <div class="section-inner">
        <div class="section-head">
          <h2 id="tools-title">当前工具</h2>
          <p id="about">从最浪费时间的小事开始，让每一个工具都保持清楚、稳定、容易使用。</p>
        </div>
        <article class="tool-row">
          <div class="tool-icon" aria-hidden="true">点</div>
          <div>
            <h3>自动点击</h3>
            <p>锁定目标位置，设置点击间隔，查看执行次数。</p>
          </div>
          <div class="platforms" aria-label="支持平台">
            <span class="platform">Android</span>
            <span class="platform">Windows</span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>AutomaticTools 工具平台</footer>

  <script>
    const status = document.getElementById('service-status');
    const label = status.lastElementChild;

    fetch('/health', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('unhealthy');
        status.classList.add('online');
        label.textContent = '服务正常';
      })
      .catch(() => {
        status.classList.add('offline');
        label.textContent = '服务离线';
      });
  </script>
</body>
</html>
